<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag SDK -->
    <script src='//libtl.com/sdk.js' data-zone='11922891' data-sdk='show_11922891'></script>
    <style>
        body { font-family: sans-serif; background: #fff; text-align: center; padding-top: 50px; }
        .btn { background: #2481cc; color: #fff; border: none; padding: 15px 25px; font-size: 18px; border-radius: 10px; cursor: pointer; margin-top: 20px;}
    </style>
</head>
<body>

    <h2>Watch & Earn</h2>
    <p>Watch full ad to get reward.</p>
    <button id="adBtn" class="btn" onclick="playAd()">Watch Ad Now</button>
    <p id="status"></p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function playAd() {
            const btn = document.getElementById("adBtn");
            const status = document.getElementById("status");

            btn.disabled = true;
            status.innerText = "Loading Ad...";

            if (typeof show_11922891 === 'function') {
                show_11922891().then(() => {
                    // Ad complete hole ei popup ta asbe
                    alert("✅ Ad dekha complete! Ebar bot-e reward jabe.");
                    status.innerText = "Sending reward signal...";
                    
                    // Bot ke simple text signal pathacchi
                    tg.sendData("ad_completed_success");
                    
                    setTimeout(() => tg.close(), 1000);
                }).catch((err) => {
                    alert("❌ Ad skipped ba load hocche na!");
                    btn.disabled = false;
                    status.innerText = "";
                });
            } else {
                alert("SDK load hoyni!");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
